services:
  # 0. PostgreSQL System of Record (Audit Logs, Conversations & Accounts)
  postgres:
    image: postgres:16-alpine
    container_name: postgres-governor
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-governor_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deloitte_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-governance_db}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-governor_admin} -d ${POSTGRES_DB:-governance_db} || pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 1. In-Memory Revocation Cache (<0.2ms sub-second killswitch)
  redis:
    image: redis:7-alpine
    container_name: redis-governor
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. Asynchronous Telemetry & Alerts Event Bus (KRaft Mode - No ZooKeeper needed)
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-governor
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Zero-Trust Gateway PEP & ML Risk Engine
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-pep
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC_TELEMETRY=${KAFKA_TOPIC_TELEMETRY:-agentic-iam.telemetry}
      - KAFKA_TOPIC_ALERTS=${KAFKA_TOPIC_ALERTS:-agentic-iam.alerts}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID:-agentic-iam-ml-risk-engine}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-governor_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-deloitte_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-governance_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-governor_admin}:${POSTGRES_PASSWORD:-deloitte_secure_pass}@postgres:5432/${POSTGRES_DB:-governance_db}
    restart: unless-stopped

  # 4. Instant GUI Database Explorer (pgweb: Zero-login, instant table & row browser)
  pgweb:
    image: sosedoff/pgweb:latest
    container_name: pgweb-governor
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-governor_admin}:${POSTGRES_PASSWORD:-deloitte_secure_pass}@postgres:5432/${POSTGRES_DB:-governance_db}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 5. Full Enterprise GUI Database Manager (pgAdmin 4 with auto-discovery)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-governor
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@deloitte.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-deloitte_secure_pass}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGPASS_FILE: /pgpass
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: governor_pgdata
  pgadmin_data:
    name: governor_pgadmin_data

